name: Build Check

on:
  push:
    branches: ['*']
    paths:
      - 'website/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./website

      - name: Build
        run: npm run build
        working-directory: ./website
